name: Ekatma 4.3 conversational evaluation
on:
  push:
    branches: [ekatma-intelligence-os]
  workflow_dispatch:

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render 4.3
        shell: bash
        run: |
          set -e
          URL="https://ekatma-intelligence-os.onrender.com"
          for i in $(seq 1 42); do
            BODY=$(curl -fsS "$URL/health" || true)
            echo "$BODY"
            if grep -q '"version":"4.3.0"' <<< "$BODY"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Validate conversational and mobile UI
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          ROOT=$(curl -fsS "$URL/")
          grep -q 'हरिः ॐ' <<< "$ROOT"
          grep -q 'Ask. Understand. Go deeper.' <<< "$ROOT"
          grep -q 'Knowledge Portal' <<< "$ROOT"
          grep -q 'interactive-widget=resizes-content' <<< "$ROOT"
          grep -q 'visualViewport' <<< "$ROOT"
          grep -q -- '--app-h' <<< "$ROOT"
          grep -q 'safe-area-inset-bottom' <<< "$ROOT"
          grep -q 'font-size:16px' <<< "$ROOT"
          ! grep -q 'Gemini synthesis · in-scope only' <<< "$ROOT"
          ! grep -q 'Evidence locked' <<< "$ROOT"
          PORTAL=$(curl -fsS "$URL/knowledge")
          grep -q 'Knowledge Portal' <<< "$PORTAL"
          CODE=$(curl -sS -o /tmp/overview -w '%{http_code}' "$URL/api/admin/knowledge-overview")
          test "$CODE" = "401"

      - name: Validate greetings and natural social behavior
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          ask(){ curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{question:$q,history:[]}')"; }
          HI=$(ask 'hii'); echo "$HI" | jq .; jq -e '.answer | test("Hari Om|हरिः ॐ")' <<< "$HI" >/dev/null
          HARI=$(ask 'hariom'); jq -e '.answer | test("Hari Om")' <<< "$HARI" >/dev/null
          JAY=$(ask 'जय शंकर'); jq -e '.answer | test("जय शंकर")' <<< "$JAY" >/dev/null
          HOW=$(ask 'how are you'); jq -e '.answer | length > 20' <<< "$HOW" >/dev/null
          OUT=$(ask 'What is AI?'); echo "$OUT" | jq .; jq -e '.refused == true and .inScope == false and (.answer | test("Ekatma Intelligence"))' <<< "$OUT" >/dev/null

      - name: Validate Advaita answers like an LLM
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          ask(){ curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{question:$q,history:[]}')"; }
          A=$(ask 'अद्वैत वेदान्त क्या है? सरल भाषा में समझाइए।'); echo "$A" | jq .
          jq -e '.refused != true and (.answer | length > 80)' <<< "$A" >/dev/null
          ! jq -r '.answer' <<< "$A" | grep -Eq '^SOURCE:|^URL:'
          B=$(ask 'Brahman aur Atman ka sambandh kya hai?'); echo "$B" | jq .
          jq -e '.refused != true and (.answer | length > 60)' <<< "$B" >/dev/null
          C=$(ask 'Adi Shankaracharya ke Advaita ka basic idea kya hai?'); echo "$C" | jq .
          jq -e '.refused != true and (.answer | length > 60)' <<< "$C" >/dev/null

      - name: Validate Nyas and Ekatma institutional answers
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          ask(){ curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{question:$q,history:[]}')"; }
          DHAM=$(ask 'what is ekatam dham'); echo "$DHAM" | jq .
          jq -e '.refused != true and (.answer | length > 60)' <<< "$DHAM" >/dev/null
          ! jq -r '.answer' <<< "$DHAM" | grep -Eq '^SOURCE:|^URL:'
          NYAS=$(ask 'Acharya Shankar Sanskritik Ekta Nyas kya hai?'); echo "$NYAS" | jq .
          jq -e '.refused != true and (.answer | length > 60)' <<< "$NYAS" >/dev/null
          ROUTE=$(ask 'एकात्म यात्रा कहाँ से कहाँ तक प्रस्तावित है?'); echo "$ROUTE" | jq .
          jq -e '.answer | test("कालड़ी|Kalady|Veliyanadu") and test("केदारनाथ|Kedarnath")' <<< "$ROUTE" >/dev/null
          jq -e '(.sources | length) >= 2' <<< "$ROUTE" >/dev/null
          CONFLICT=$(ask 'Ekatma Yatra kitne din ki hai?'); echo "$CONFLICT" | jq .
          jq -e '.answer | test("114") and test("115")' <<< "$CONFLICT" >/dev/null

      - name: Validate unknown institutional facts do not hallucinate
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          BODY=$(curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data '{"question":"Ekatma Yatra ke Maharath ka final vehicle registration number kya hai?","history":[]}')
          echo "$BODY" | jq .
          jq -e '.refused == true or (.answer | test("not confirmed|not available|नहीं|उपलब्ध|पुष्ट", "i"))' <<< "$BODY" >/dev/null

      - name: Validate knowledge corpus
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          STATS=$(curl -fsS "$URL/api/canonical-stats")
          jq -e '.facts == 117 and .sources == 21 and .topics == 16 and .reverseQuestionForms >= 900' <<< "$STATS" >/dev/null
          QS=$(curl -fsS "$URL/api/probable-questions")
          jq -e '[.groups[].questions[]] | length >= 900' <<< "$QS" >/dev/null
