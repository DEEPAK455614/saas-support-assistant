name: Ekatma UI resilience
on:
  push:
    branches: [ekatma-intelligence-os]
  workflow_dispatch:

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VedantaNY adapter against pinned upstream corpus
        shell: bash
        run: |
          set -euo pipefail
          cd ekatma-render
          node --input-type=module <<'NODE'
          import { vedantaNySearch, vedantaNyStats } from './vedantany-source.mjs';
          const rows=await vedantaNySearch('What constitutes Sadhana Chatushtaya?',{limit:4,minScore:.13});
          const stats=vedantaNyStats();
          console.log(JSON.stringify({stats,top:rows[0]||null},null,2));
          if(!rows.length) throw new Error('No VedantaNY result');
          if(rows[0].origin!=='vedantany_10m') throw new Error('Wrong source origin');
          if(!/Sadhana Chatushtaya/i.test(rows[0].title||rows[0].content||'')) throw new Error('Expected Sadhana source not retrieved');
          if(stats.entries<20) throw new Error(`Too few upstream entries loaded: ${stats.entries}`);
          NODE
      - name: Verify live Advaitic UI and VedantaNY chat
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          for i in $(seq 1 30); do
            HTML=$(curl -fsS "$URL/" || true)
            if grep -q 'सर्वं खल्विदं ब्रह्म' <<<"$HTML"; then break; fi
            sleep 4
          done
          HTML=$(curl -fsS "$URL/")
          grep -q 'सर्वं खल्विदं ब्रह्म' <<<"$HTML"
          grep -q 'एकमेवाद्वितीयम्' <<<"$HTML"
          grep -q 'Ekatma Intelligence' <<<"$HTML"
          grep -q 'Knowledge Portal' <<<"$HTML"
          ! grep -q 'cdn.jsdelivr.net/npm/react' <<<"$HTML"
          HEALTH=$(curl -fsS "$URL/health")
          jq -e '.ok==true and .qa930.questions==930 and .canonicalKnowledge.facts==117' <<<"$HEALTH" >/dev/null

          BODY=$(curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data '{"question":"अद्वैत वेदान्त में जीव और ब्रह्म के संबंध को सरल उदाहरण से समझाइए।","history":[]}')
          echo "$BODY" | jq .
          jq -e '.refused != true and (.answer|length>80)' <<<"$BODY" >/dev/null
          MODE=$(jq -r '.composer // "none"' <<<"$BODY")
          case "$MODE" in
            openrouter|openrouter-cache|openrouter+vedantany-10m) ;;
            *) echo "OpenRouter was not used: $MODE"; exit 1;;
          esac

          VEDANTA_BODY=''
          for i in $(seq 1 45); do
            VEDANTA_BODY=$(curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data '{"question":"What constitutes Sadhana Chatushtaya?","history":[]}' || true)
            if jq -e '.meta.knowledgeLayer=="VedantaNY-10M" and (.sources|map(.origin)|index("vedantany_10m")!=null)' <<<"$VEDANTA_BODY" >/dev/null 2>&1; then break; fi
            sleep 4
          done
          echo "$VEDANTA_BODY" | jq .
          jq -e '.refused != true and (.answer|length>80) and .meta.knowledgeLayer=="VedantaNY-10M" and (.sources|map(.origin)|index("vedantany_10m")!=null)' <<<"$VEDANTA_BODY" >/dev/null
          echo "Advaitic UI, OpenRouter and VedantaNY-10M knowledge layer are live."
