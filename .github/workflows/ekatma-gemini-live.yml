name: Ekatma Gemini live verification
on:
  push:
    branches: [ekatma-intelligence-os]
  workflow_dispatch:

jobs:
  verify-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Gemini conversational composer
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ekatma-intelligence-os.onrender.com"
          for i in $(seq 1 20); do
            HEALTH=$(curl -fsS "$URL/health" || true)
            if grep -q '"version":"4.3.0"' <<< "$HEALTH"; then break; fi
            sleep 5
          done
          BODY=$(curl -fsS "$URL/api/chat" -H 'content-type: application/json' --data '{"question":"अद्वैत वेदान्त क्या है? सरल भाषा में समझाइए।","history":[]}')
          echo "$BODY" | jq .
          MODE=$(jq -r '.composer // "none"' <<< "$BODY")
          MODEL=$(jq -r '.model // "none"' <<< "$BODY")
          echo "### Ekatma Gemini live check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Composer: $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: $MODEL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Answer length: $(jq -r '.answer | length' <<< "$BODY")" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.refused != true and (.answer | length > 80)' <<< "$BODY" >/dev/null
          [[ "$MODE" == gemini* ]]
