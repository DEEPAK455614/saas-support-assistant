<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
<meta name="theme-color" content="#fbfaf6" />
<title>Ekatma Intelligence</title>
<style>
:root{--ink:#20231f;--muted:#6f746f;--line:#e6e1d7;--paper:#fbfaf6;--panel:#f3f0e8;--accent:#8b552b;--white:#fff;--vh:100dvh;--shadow:0 10px 34px rgba(34,29,23,.08)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{height:var(--vh);display:flex;overflow:hidden}.sidebar{width:260px;flex:0 0 260px;border-right:1px solid var(--line);background:#f4f1e9;padding:14px;display:flex;flex-direction:column;gap:12px;transition:.2s}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff9ef;border:1px solid #d9d0c0;color:var(--accent)}.new{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:600}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8e918d;margin:4px}.history{flex:1;overflow:auto}.history button,.side-link{width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:left;color:#555a56;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history button.active,.side-link:hover{background:#eae6dd;color:#222}.foot{font-size:11px;color:#8c8f8a;padding:7px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}.top{height:58px;flex:0 0 58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;background:rgba(251,250,246,.95);gap:12px}.menu{display:none;border:0;background:transparent;font-size:22px}.title{font-weight:700}.sub{margin-left:auto;font-size:12px;color:var(--muted)}.scroll{flex:1;overflow:auto;padding:20px 18px 8px}.inner{max-width:860px;margin:auto}.welcome{text-align:center;padding:8vh 10px 32px}.mantra{color:var(--accent);font-size:18px;margin-bottom:14px}.welcome h1{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif;font-size:39px;font-weight:650;letter-spacing:-.02em;margin:0 0 10px;color:#2b2b25}.mission-line{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif;font-size:17px;color:var(--accent);margin:0 auto 9px}.welcome p{max-width:680px;margin:0 auto 26px;color:var(--muted);line-height:1.6}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:auto}.prompt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;color:#434844;min-height:70px}.prompt:hover{background:#fffdf8;border-color:#ccbda9}.msg{display:flex;gap:12px;margin-bottom:24px}.msg.user{justify-content:flex-end}.avatar{width:29px;height:29px;flex:0 0 29px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}.bubble{max-width:min(760px,88%);line-height:1.68;font-size:15px;white-space:pre-wrap}.user .bubble{background:#eeeae1;border:1px solid #e2ddd3;border-radius:18px 18px 6px 18px;padding:10px 14px}.assistant .bubble{padding:1px 2px}.sources{margin-top:10px}.sources summary{font-size:12px;color:#727772}.source-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:12px;color:#626863;margin-top:7px}.source-title{font-weight:650;color:#424742}.typing{display:inline-flex;gap:5px;padding:9px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#989b96;animation:b 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer-wrap{flex:0 0 auto;padding:8px 18px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(251,250,246,0),var(--paper) 22%)}.composer{max-width:860px;margin:auto;display:flex;align-items:flex-end;gap:8px;border:1px solid #d8d3c8;border-radius:19px;background:#fff;padding:8px 9px 8px 14px;box-shadow:var(--shadow)}.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:38px;max-height:150px;padding:9px 2px;background:transparent;font-size:16px;line-height:1.4}.send{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;background:#282b28;color:#fff}.send:disabled{opacity:.35}.note{text-align:center;font-size:10px;color:#999c97;margin-top:6px}.overlay{display:none;position:fixed;inset:0;background:rgba(20,20,20,.2);z-index:18}
.portal{height:var(--vh);overflow:auto;background:#f8f6f1}.portal-shell{max-width:1220px;margin:auto;padding:22px 22px 60px}.portal-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.portal-head h1{margin:0;font-size:25px}.portal-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.back{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.login{height:var(--vh);display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}.login-card h2{margin:0 0 7px}.login-card p{font-size:13px;color:var(--muted);line-height:1.5}.field{width:100%;border:1px solid #dcd7cd;border-radius:10px;padding:10px 11px;outline:0;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600}.btn.primary{background:#2b2e2b;color:#fff;border-color:#2b2e2b}.btn.danger{color:#9f3434}.error{background:#fff1ef;border:1px solid #f0d4d0;color:#8b3b34;border-radius:10px;padding:10px;font-size:12px;margin-top:9px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:18px}.tab{border:0;background:transparent;padding:10px 13px;color:#696e6a;border-bottom:2px solid transparent}.tab.active{font-weight:700;color:#292d2a;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{padding:17px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 5px}.desc{font-size:12px;color:var(--muted);margin-bottom:13px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:240px}.drop{border:1.5px dashed #cbc3b5;border-radius:15px;padding:28px 18px;text-align:center;background:#fbfaf6}.drop h3{margin:5px 0}.drop p{font-size:12px;color:var(--muted)}.jobs{display:grid;gap:8px;margin-top:12px}.job,.doc{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;justify-content:space-between;gap:10px}.ok{color:#287046}.err{color:#9e3939}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eeeae2;vertical-align:top}th{background:#faf8f3}.preview{white-space:pre-wrap;line-height:1.55;max-height:420px;overflow:auto;background:#faf9f5;border-radius:10px;padding:12px;font-size:12px}
@media(max-width:820px){.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-102%);box-shadow:18px 0 40px rgba(0,0,0,.13)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}.menu{display:block}.top{padding:0 12px}.sub{display:none}.scroll{padding:15px 12px 6px}.composer-wrap{padding-left:10px;padding-right:10px}.prompts{grid-template-columns:1fr}.welcome{padding-top:5vh}.welcome h1{font-size:31px}.stats{grid-template-columns:1fr 1fr}.portal-shell{padding:14px 12px 40px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
const $=s=>document.querySelector(s), app=$('#app');
const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function syncVh(){document.documentElement.style.setProperty('--vh',(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px')}syncVh();addEventListener('resize',syncVh);visualViewport&&visualViewport.addEventListener('resize',syncVh);
function loadChats(){try{return JSON.parse(localStorage.getItem('ekatma_chats_safe')||'[]')}catch{return[]}}
function saveChats(x){localStorage.setItem('ekatma_chats_safe',JSON.stringify(x.slice(0,30)))}
if(location.pathname.startsWith('/knowledge')) renderPortal(); else renderChat();

function renderChat(){let chats=loadChats(), id=chats[0]?.id||uid(), messages=chats[0]?.messages||[], busy=false, side=false;
app.innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="brand"><div class="mark">ॐ</div><div>Ekatma Intelligence</div></div><button class="new" id="newChat">＋ New chat</button><div class="label">Recent</div><div class="history" id="hist"></div><a class="side-link" href="/knowledge">▦ Knowledge Portal</a><div class="foot">॥ सर्वं खल्विदं ब्रह्म ॥</div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><button class="menu" id="menu">☰</button><div class="title">Ekatma Intelligence</div><div class="sub">Nyas · Ekatma · Advaita</div></header><div class="scroll" id="scroll"><div class="inner" id="msgs"></div></div><div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" enterkeyhint="send" placeholder="Ask about Ekatma, Nyas, Shankaracharya or Advaita…"></textarea><button class="send" id="send">↑</button></div><div class="note">Answers use conversation context and the latest available Ekatma knowledge.</div></div></main></div>`;
const hist=$('#hist'), msgs=$('#msgs'), input=$('#input'), send=$('#send'), scroll=$('#scroll'), sideEl=$('#side'), overlay=$('#overlay');
function history(){hist.innerHTML=chats.map(c=>`<button data-id="${esc(c.id)}" class="${c.id===id?'active':''}">${esc(c.title||'Conversation')}</button>`).join('');hist.querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=chats.find(x=>x.id===b.dataset.id);if(c){id=c.id;messages=c.messages||[];side=false;sideEl.classList.remove('open');overlay.classList.remove('show');paint();history()}})}
function title(){const q=messages.find(m=>m.role==='user')?.content||'New conversation';return q.length>42?q.slice(0,42)+'…':q}
function persist(){if(!messages.length)return;chats=[{id,title:title(),updated:Date.now(),messages},...chats.filter(c=>c.id!==id)];saveChats(chats);history()}
function sourceHtml(s){return `<div class="source-card"><div class="source-title">${esc(s.title||s.file_name||'Source')}</div><div>${esc([s.page_number?'p. '+s.page_number:'',s.document_date||'',s.trust||''].filter(Boolean).join(' · '))}</div></div>`}
function paint(){if(!messages.length){msgs.innerHTML=`<div class="welcome"><div class="mantra">हरिः ॐ 🙏</div><h1>॥ सर्वं खल्विदं ब्रह्म ॥</h1><div class="mission-line">एकमेवाद्वितीयम् — One Reality, without a second.</div><p>Ekatma Intelligence carries this vision of oneness into knowledge, dialogue and the welfare of all — connecting Ekatma Dham, Ekatma Yatra, Acharya Shankar Sanskritik Ekta Nyas, Adi Shankaracharya and Advaita Vedanta.</p><div class="prompts">${['What is Ekatma Dham and why is it significant?','एकात्म यात्रा 2027 कहाँ से कहाँ तक प्रस्तावित है?','अद्वैत वेदान्त को सरल भाषा में समझाइए।','Who was Adi Shankaracharya?'].map(x=>`<button class="prompt" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;msgs.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>ask(b.dataset.q));}
else msgs.innerHTML=messages.map(m=>m.role==='user'?`<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`:`<div class="msg assistant"><div class="avatar">ॐ</div><div class="bubble">${esc(m.content)}${m.sources?.length?`<details class="sources"><summary>Sources (${m.sources.length})</summary>${m.sources.slice(0,8).map(sourceHtml).join('')}</details>`:''}</div></div>`).join('')+(busy?`<div class="msg assistant"><div class="avatar">ॐ</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`:'');setTimeout(()=>scroll.scrollTop=scroll.scrollHeight,0)}
async function ask(q){q=String(q||input.value||'').trim();if(!q||busy)return;const historyPayload=messages.map(m=>({role:m.role,content:m.content}));messages.push({role:'user',content:q});input.value='';busy=true;paint();try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history:historyPayload})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');messages.push({role:'assistant',content:j.answer||'No answer returned.',sources:j.sources||[]})}catch(e){messages.push({role:'assistant',content:'I could not complete that request right now. Please try again.\n\n'+e.message,sources:[]})}finally{busy=false;persist();paint();input.focus()}}
send.onclick=()=>ask();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};$('#newChat').onclick=()=>{id=uid();messages=[];paint();history();input.focus()};$('#menu').onclick=()=>{side=true;sideEl.classList.add('open');overlay.classList.add('show')};overlay.onclick=()=>{side=false;sideEl.classList.remove('open');overlay.classList.remove('show')};history();paint();}

function renderPortal(){let key=sessionStorage.getItem('ekatma_portal_key')||'', authed=false, tab='overview', overview=null, stats=null, docs=[], qa={rows:[],total:0}, jobs=[];
function headers(){return {'x-admin-key':key}}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(r.status===401)throw new Error('Invalid portal key');if(!r.ok)throw new Error(j.error||j.detail||'Request failed');return j}
async function refresh(){[overview,stats]=await Promise.all([api('/api/admin/knowledge-overview'),api('/api/admin/kb-stats')]);try{const d=await api('/api/admin/documents');docs=d.documents||[]}catch{docs=[]}authed=true;sessionStorage.setItem('ekatma_portal_key',key);paint()}
function login(){key=$('#portalKey').value.trim();refresh().catch(e=>{$('#loginErr').textContent=e.message;$('#loginErr').style.display='block'})}
function loginScreen(){app.innerHTML=`<div class="login"><div class="login-card"><div class="brand" style="margin-bottom:16px"><div class="mark">ॐ</div><div>Ekatma Knowledge Portal</div></div><h2>Knowledge administration</h2><p>View the corpus, upload documents and add verified material. Successfully indexed content becomes available to Ekatma Intelligence.</p><input id="portalKey" class="field" type="password" placeholder="Portal access key" value="${esc(key)}"><div id="loginErr" class="error" style="display:none"></div><button id="loginBtn" class="btn primary" style="width:100%;margin-top:10px">Open portal</button><a href="/" style="display:block;text-align:center;margin-top:14px;font-size:12px;color:#737873">← Back to Ekatma Intelligence</a></div></div>`;$('#loginBtn').onclick=login;$('#portalKey').onkeydown=e=>{if(e.key==='Enter')login()}}
function paint(){if(!authed)return loginScreen();const m=stats?.managed||{}, q=overview?.qa930||{};app.innerHTML=`<div class="portal"><div class="portal-shell"><div class="portal-head"><div class="mark">ॐ</div><div><h1>Knowledge Portal</h1><p>One knowledge layer shared with Ekatma Intelligence</p></div><a class="back" href="/">← Chat</a></div><div class="tabs">${['overview','upload','documents','qa'].map(x=>`<button class="tab ${tab===x?'active':''}" data-tab="${x}">${x==='qa'?'930 Q&A':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div id="panel"></div></div></div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint();if(tab==='qa')loadQa()});renderPanel(m,q)}
function renderPanel(m,q){const p=$('#panel');if(tab==='overview'){p.innerHTML=`<div class="stats"><div class="stat"><b>${overview?.stats?.facts||117}</b><span>Canonical facts</span></div><div class="stat"><b>${q.questions||930}</b><span>Q&A entries</span></div><div class="stat"><b>${m.documents||0}</b><span>Managed uploads</span></div><div class="stat"><b>${m.chunks||0}</b><span>Retrievable chunks</span></div></div><div class="panel"><h2>Knowledge health</h2><div class="desc">The chat reads canonical facts, the 930-Q&A corpus and successfully indexed managed documents.</div><div>${q.categories||26} Q&A categories · ${q.sources||26} workbook sources · ${m.embeddedChunks||0} embedded chunks</div></div>`}
if(tab==='upload'){p.innerHTML=`<div class="panel"><h2>Upload knowledge</h2><div class="desc">Select multiple files. Text files are indexed directly; supported binary documents are processed by the knowledge backend.</div><div class="drop" id="drop"><div style="font-size:26px">⇧</div><h3>Choose files</h3><p>PDF · TXT · MD · CSV · JSON · XLSX · MP3 · WAV · M4A · MP4 · up to 20 MB each</p><button class="btn primary" id="choose">Choose multiple files</button><input id="files" type="file" multiple hidden></div><div class="jobs" id="jobs"></div></div><div class="panel"><h2>Add text directly</h2><input class="field" id="pasteTitle" placeholder="Title / source name" style="margin-bottom:8px"><textarea class="field" id="pasteText" style="min-height:160px;resize:vertical" placeholder="Paste knowledge here…"></textarea><button class="btn primary" id="addText" style="margin-top:8px">Add to Ekatma Intelligence</button></div>`;$('#choose').onclick=()=>$('#files').click();$('#files').onchange=e=>uploadFiles(e.target.files);$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();uploadFiles(e.dataTransfer.files)};$('#addText').onclick=()=>{const t=$('#pasteText').value.trim();if(!t)return;const f=new File([t],($('#pasteTitle').value.trim()||'Pasted knowledge')+'.txt',{type:'text/plain'});uploadFiles([f])};renderJobs()}
if(tab==='documents'){p.innerHTML=`<div class="panel"><div class="toolbar"><h2 style="margin:0">Managed documents</h2><button id="ref" class="btn" style="margin-left:auto">Refresh</button></div><div>${docs.length?docs.map(d=>`<div class="doc"><div><b>${esc(d.title||d.file_name||'Document')}</b><div class="desc" style="margin:4px 0 0">${esc(d.file_name||'')} · ${d.chunks||0} chunks</div></div><div><button class="btn previewBtn" data-id="${esc(d.id)}">Preview</button> <button class="btn danger delBtn" data-id="${esc(d.id)}">Delete</button></div></div>`).join(''):'<div class="desc">No managed uploads yet.</div>'}</div></div>`;$('#ref').onclick=()=>refresh();document.querySelectorAll('.delBtn').forEach(b=>b.onclick=()=>del(b.dataset.id));document.querySelectorAll('.previewBtn').forEach(b=>b.onclick=()=>preview(b.dataset.id))}
if(tab==='qa'){p.innerHTML=`<div class="panel"><h2>930 Q&A knowledge corpus</h2><div class="toolbar"><input id="qsearch" class="field search" placeholder="Search questions, answers or topics…"><button id="qbtn" class="btn primary">Search</button></div><div id="qtable" class="table-wrap"><div style="padding:14px" class="desc">Loading…</div></div></div>`;$('#qbtn').onclick=()=>loadQa($('#qsearch').value);$('#qsearch').onkeydown=e=>{if(e.key==='Enter')loadQa(e.target.value)}}}
async function loadQa(search=''){try{qa=await api('/api/admin/qa?limit=100&q='+encodeURIComponent(search));const t=$('#qtable');if(!t)return;t.innerHTML=`<table><thead><tr><th>ID</th><th>Category</th><th>Question</th><th>Canonical answer</th><th>Status</th><th>Confidence</th></tr></thead><tbody>${(qa.rows||[]).map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.category)}</td><td>${esc(r.question)}</td><td>${esc(r.answer||r.canonical_answer||'')}</td><td>${esc(r.status||'')}</td><td>${esc(r.confidence||'')}</td></tr>`).join('')}</tbody></table>`}catch(e){const t=$('#qtable');if(t)t.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderJobs(){const j=$('#jobs');if(j)j.innerHTML=jobs.map(x=>`<div class="job"><span>${esc(x.name)}</span><span class="${x.cls||''}">${esc(x.state)}</span></div>`).join('')}
function b64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
async function uploadFiles(list){for(const file of [...list]){const job={id:uid(),name:file.name,state:'Preparing…'};jobs.unshift(job);renderJobs();try{if(file.size>20*1024*1024)throw new Error('File larger than 20 MB');let f=file;const ext=(file.name.split('.').pop()||'').toLowerCase();if(['txt','md','csv','json'].includes(ext)){const text=await file.text();f=new File([text],file.name,{type:'text/plain'})}job.state='Uploading & indexing…';renderJobs();await api('/api/admin/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fileName:f.name,mimeType:f.type||'application/octet-stream',base64:await b64(f),title:file.name,trust:'verified'})});job.state='Ready — synced with chat';job.cls='ok'}catch(e){job.state='Failed: '+e.message;job.cls='err'}renderJobs()}await refresh();tab='upload';paint()}
async function del(id){if(!confirm('Delete this knowledge document?'))return;await api('/api/admin/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({documentId:id})});await refresh();tab='documents';paint()}
async function preview(id){try{const j=await api('/api/admin/preview?id='+encodeURIComponent(id));const text=(j.chunks||[]).map(c=>(c.page_number?'[Page '+c.page_number+'] ':'')+(c.section_title?c.section_title+'\n':'')+(c.content||'')).join('\n\n');alert(text.slice(0,12000)||'No preview available')}catch(e){alert(e.message)}}
if(key)refresh().catch(()=>loginScreen());else loginScreen();}
})();
</script>
</body>
</html>
