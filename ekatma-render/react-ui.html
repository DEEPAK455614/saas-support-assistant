<script>
const {useState,useEffect,useRef,useMemo}=React;const h=React.createElement;

function useViewport(){useEffect(()=>{const apply=()=>{const v=window.visualViewport;document.documentElement.style.setProperty('--vhpx',(v?v.height:window.innerHeight)+'px')};apply();window.addEventListener('resize',apply);window.visualViewport?.addEventListener('resize',apply);window.visualViewport?.addEventListener('scroll',apply);return()=>{window.removeEventListener('resize',apply);window.visualViewport?.removeEventListener('resize',apply);window.visualViewport?.removeEventListener('scroll',apply)}},[])}
function md(text){try{return{__html:DOMPurify.sanitize(marked.parse(String(text||''),{breaks:true,gfm:true}))}}catch{return{__html:String(text||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')}}}
function niceTitle(messages){const first=messages.find(x=>x.role==='user')?.content||'New conversation';return first.length>42?first.slice(0,42)+'…':first}
function loadChats(){try{return JSON.parse(localStorage.getItem('ekatma_chats_v5')||'[]')}catch{return[]}}
function ChatApp(){useViewport();const [chats,setChats]=useState(loadChats);const [id,setId]=useState(()=>chats[0]?.id||crypto.randomUUID());const [messages,setMessages]=useState(()=>chats.find(c=>c.id===id)?.messages||[]);const [input,setInput]=useState('');const [busy,setBusy]=useState(false);const [side,setSide]=useState(false);const textRef=useRef(),scrollRef=useRef();
useEffect(()=>{const c=chats.find(x=>x.id===id);if(c)setMessages(c.messages||[])},[id]);
useEffect(()=>{scrollRef.current?.scrollTo({top:scrollRef.current.scrollHeight,behavior:'smooth'});const next=[{id,title:niceTitle(messages),updated:Date.now(),messages},...chats.filter(c=>c.id!==id)].filter(c=>c.messages?.length).slice(0,30);if(messages.length){setChats(next);localStorage.setItem('ekatma_chats_v5',JSON.stringify(next))}},[messages]);
function newChat(){const n=crypto.randomUUID();setId(n);setMessages([]);setInput('');setSide(false);setTimeout(()=>textRef.current?.focus(),50)}
async function send(q=input){q=String(q||'').trim();if(!q||busy)return;const hist=messages.map(m=>({role:m.role,content:m.content}));setMessages(m=>[...m,{role:'user',content:q}]);setInput('');setBusy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history:hist})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');setMessages(m=>[...m,{role:'assistant',content:j.answer||'No answer returned.',sources:j.sources||[]}])}catch(e){setMessages(m=>[...m,{role:'assistant',content:'I could not complete that request right now. Please try once more.\n\n'+e.message,sources:[]}])}finally{setBusy(false);setTimeout(()=>textRef.current?.focus(),80)}}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
const prompts=['What is Ekatma Dham and why is it significant?','एकात्म यात्रा 2027 कहाँ से कहाँ तक प्रस्तावित है?','अद्वैत वेदान्त को सरल भाषा में समझाइए।','Who was Adi Shankaracharya?'];
return h('div',{className:'app'},
 h('div',{className:'sidebar '+(side?'open':'')},h('div',{className:'brand'},h('div',{className:'brand-mark'},'ॐ'),h('div',null,'Ekatma Intelligence')),h('button',{className:'new-chat',onClick:newChat},'＋  New chat'),h('div',{className:'side-label'},'Recent'),h('div',{className:'history'},chats.map(c=>h('button',{key:c.id,className:'history-item '+(c.id===id?'active':''),onClick:()=>{setId(c.id);setSide(false)}},c.title))),h('a',{className:'side-link',href:'/knowledge'},'▦  Knowledge Portal'),h('div',{className:'side-foot'},'॥ सर्वं खल्विदं ब्रह्म ॥')),
 h('div',{className:'overlay '+(side?'show':''),onClick:()=>setSide(false)}),
 h('main',{className:'main'},h('header',{className:'topbar'},h('button',{className:'menu-btn',onClick:()=>setSide(true)},'☰'),h('div',{className:'top-title'},'Ekatma Intelligence'),h('div',{className:'top-sub'},'Nyas · Ekatma · Advaita')),
  h('div',{className:'chat-scroll',ref:scrollRef},h('div',{className:'chat-inner'},messages.length===0?h('div',{className:'welcome'},h('div',{className:'welcome-mantra'},'हरिः ॐ 🙏'),h('h1',null,'Ask. Understand. Go deeper.'),h('p',null,'Explore Ekatma Dham, Ekatma Yatra, Acharya Shankar Sanskritik Ekta Nyas, Adi Shankaracharya and Advaita Vedanta in a natural conversation.'),h('div',{className:'prompt-grid'},prompts.map(p=>h('button',{className:'prompt-card',key:p,onClick:()=>send(p)},p)))):messages.map((m,i)=>h(Message,{key:i,m})),busy&&h('div',{className:'msg assistant'},h('div',{className:'avatar'},'ॐ'),h('div',{className:'bubble'},h('div',{className:'typing'},h('i'),h('i'),h('i'))))))),
  h('div',{className:'composer-wrap'},h('div',{className:'composer'},h('textarea',{ref:textRef,value:input,onChange:e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'},onKeyDown:key,placeholder:'Ask about Ekatma, Nyas, Shankaracharya or Advaita…',rows:1,enterKeyHint:'send'}),h('button',{className:'send',disabled:busy||!input.trim(),onClick:()=>send()},'↑')),h('div',{className:'composer-note'},'Answers use conversation context and the latest available Ekatma knowledge.'))));}
function Message({m}){if(m.role==='user')return h('div',{className:'msg user'},h('div',{className:'bubble'},m.content));return h('div',{className:'msg assistant'},h('div',{className:'avatar'},'ॐ'),h('div',{className:'bubble'},h('div',{dangerouslySetInnerHTML:md(m.content)}),m.sources?.length?h('details',{className:'sources'},h('summary',null,`Sources (${m.sources.length})`),h('div',{className:'source-list'},m.sources.slice(0,8).map((s,i)=>h('div',{className:'source-card',key:i},h('div',{className:'source-title'},s.title||s.file_name||`Source ${i+1}`),h('div',{className:'source-meta'},[s.page_number?`p. ${s.page_number}`:'',s.document_date||'',s.trust||''].filter(Boolean).join(' · ')))))):null));}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
async function normalizeUpload(file){const name=file.name||'document';const ext=(name.split('.').pop()||'').toLowerCase();if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw new Error('Excel parser could not load');const ab=await file.arrayBuffer();const wb=XLSX.read(ab,{type:'array'});let text=`SOURCE FILE: ${name}\n\n`;for(const sn of wb.SheetNames){text+=`===== SHEET: ${sn} =====\n`;text+=XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false})+'\n\n'}const blob=new File([text],name+'.txt',{type:'text/plain'});return{file:blob,title:name,original:name}}if(ext==='csv'||ext==='json'){const text=await file.text();return{file:new File([`SOURCE FILE: ${name}\n\n${text}`],name+'.txt',{type:'text/plain'}),title:name,original:name}}if(ext==='md'&&!file.type)return{file:new File([await file.text()],name,{type:'text/markdown'}),title:name,original:name};return{file,title:name,original:name}}
function Portal(){useViewport();const [key,setKey]=useState(()=>sessionStorage.getItem('ekatma_portal_key')||'');const [authed,setAuthed]=useState(false);const [tab,setTab]=useState('overview');const [overview,setOverview]=useState(null);const [stats,setStats]=useState(null);const [docs,setDocs]=useState([]);const [qa,setQa]=useState({rows:[],total:0,categories:[]});const [q,setQ]=useState('');const [factQ,setFactQ]=useState('');const [jobs,setJobs]=useState([]);const [drag,setDrag]=useState(false);const [loginErr,setLoginErr]=useState('');const [preview,setPreview]=useState(null);const [pasteTitle,setPasteTitle]=useState('');const [pasteText,setPasteText]=useState('');const inputRef=useRef();
const headers=()=>({'x-admin-key':key});
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(r.status===401){setAuthed(false);throw new Error('Invalid portal key')}if(!r.ok)throw new Error(j.error||j.detail||'Request failed');return j}
async function refresh(){const [o,s,d]=await Promise.all([api('/api/admin/knowledge-overview'),api('/api/admin/kb-stats'),api('/api/admin/documents')]);setOverview(o);setStats(s);setDocs(d.documents||[]);setAuthed(true);sessionStorage.setItem('ekatma_portal_key',key)}
async function login(e){e?.preventDefault();setLoginErr('');try{await refresh();await loadQa('')}catch(err){setLoginErr(err.message)}}
useEffect(()=>{if(key)login()},[]);

async function uploadFiles(list){const files=[...list];if(!files.length)return;const newJobs=files.map(f=>({id:crypto.randomUUID(),name:f.name,state:'Queued'}));setJobs(x=>[...newJobs,...x]);for(let idx=0;idx<files.length;idx++){const file=files[idx],jid=newJobs[idx].id;const update=(state,cls='')=>setJobs(xs=>xs.map(x=>x.id===jid?{...x,state,cls}:x));try{update('Preparing…');const n=await normalizeUpload(file);if(n.file.size>20*1024*1024)throw new Error('File is larger than 20 MB');update('Uploading & indexing…');const base64=await fileToBase64(n.file);await api('/api/admin/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fileName:n.file.name,mimeType:n.file.type||'application/octet-stream',base64,title:n.title,trust:'verified'})});update('Ready — synced with chat','ok')}catch(e){update('Failed: '+e.message,'err')}}await refresh()}
